<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Home</title>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/scene.css">

  <!-- Three.js (biblioteca 3D) carregado por CDN: "three" e "three/addons/..." nos imports -->
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar navbar-expand-md navbar-dark bg-dark sticky-top">
    <div class="container-fluid">
      <a class="navbar-brand" href="#dashboard"><i class="fa-solid fa-house-signal me-2"></i><span id="home-name">Smart Home</span></a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav-menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="nav-menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="#dashboard" data-view="dashboard"><i class="fa-solid fa-gauge me-1"></i>Painel</a></li>
          <li class="nav-item"><a class="nav-link" href="#regras" data-view="regras"><i class="fa-solid fa-gears me-1"></i>Regras</a></li>
          <li class="nav-item"><a class="nav-link" href="#dispositivos" data-view="dispositivos"><i class="fa-solid fa-microchip me-1"></i>Dispositivos</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container-fluid py-4">

    <!-- Ecrã 1: Painel principal -->
    <section id="view-dashboard" class="app-view">
      <h2 class="h4 mb-3">Visão geral</h2>
      <div id="general-info" class="row g-3 mb-4"></div>

      <!-- Casa 3D (scene3d/) -->
      <div id="house-3d" class="house-3d mb-4">
        <div id="house-3d-overlay" class="house-3d-overlay">Arraste para rodar · roda do rato para zoom · clique numa divisão</div>
      </div>

      <!-- Lista de divisões (alternativa ao 3D; aparece sozinha se o 3D falhar) -->
      <div class="d-flex justify-content-between align-items-center mb-3">
        <h2 class="h4 m-0">Divisões</h2>
        <button id="toggle-list" class="btn btn-sm btn-outline-secondary" type="button">
          <i class="fa-solid fa-list me-1"></i><span>Ver em lista</span>
        </button>
      </div>
      <div id="zones-container" class="row g-3 d-none"></div>
    </section>

    <!-- Ecrã 2: Regras de automação -->
    <section id="view-regras" class="app-view d-none">
      <div class="row g-4">
        <div class="col-lg-5">
          <div class="card">
            <div class="card-header"><i class="fa-solid fa-plus me-1"></i>Nova regra</div>
            <div class="card-body">
              <form id="rule-form"></form>
            </div>
          </div>
        </div>
        <div class="col-lg-7">
          <h2 class="h5">Regras definidas</h2>
          <div id="rules-list" class="list-group mb-4"></div>

          <h2 class="h5">Alertas recentes</h2>
          <div id="alerts-list" class="list-group"></div>
        </div>
      </div>
    </section>

    <!-- Ecrã 3: Gestão de dispositivos e zonas -->
    <section id="view-dispositivos" class="app-view d-none">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="card mb-3">
            <div class="card-header"><i class="fa-solid fa-door-open me-1"></i>Nova divisão</div>
            <div class="card-body"><form id="zone-form"></form></div>
          </div>
          <div class="card">
            <div class="card-header"><i class="fa-solid fa-plug me-1"></i>Novo dispositivo</div>
            <div class="card-body"><form id="device-form"></form></div>
          </div>
        </div>
        <div class="col-lg-8">
          <div id="devices-list"></div>
        </div>
      </div>
    </section>

  </main>

  <!-- Painel lateral da divisão (components/room-panel.js) -->
  <div class="offcanvas offcanvas-end room-panel" tabindex="-1" id="room-panel"
       data-bs-scroll="true" data-bs-backdrop="false" aria-labelledby="room-panel-title">
    <div class="offcanvas-header border-bottom">
      <h5 class="offcanvas-title" id="room-panel-title"></h5>
      <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Fechar"></button>
    </div>
    <div class="offcanvas-body" id="room-panel-body"></div>
  </div>

  <!-- Toasts para feedback -->
  <div id="toast-area" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
