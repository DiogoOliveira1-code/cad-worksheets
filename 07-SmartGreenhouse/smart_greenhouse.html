<!DOCTYPE html>
<html lang="pt-pt">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Greenhouse - Dashboard</title>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- Barra de Navegação -->
    <nav class="navbar navbar-dark bg-dark shadow-sm">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1"><i class="fa-solid fa-seedling"></i> Smart Greenhouse</span>
            <span class="text-white-50">Dashboard</span>
        </div>
    </nav>

    <div class="container my-4">
        <!-- Linha dos Sensores -->
        <div class="row g-3">
            <!-- Temperatura -->
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title text-muted"><i class="fa-solid fa-temperature-high text-danger"></i> Temperature</h5>
                        <h2 id="temp-val" class="display-6 fw-bold">-- °C</h2>
                        <p id="temp-time" class="text-muted small mb-0">A aguardar leitura...</p>
                    </div>
                </div>
            </div>

            <!-- Humidade -->
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title text-muted"><i class="fa-solid fa-droplet text-primary"></i> Humidity</h5>
                        <h2 id="hum-val" class="display-6 fw-bold">-- %</h2>
                        <p id="hum-time" class="text-muted small mb-0">A aguardar leitura...</p>
                    </div>
                </div>
            </div>

            <!-- Luminosidade -->
            <div class="col-md-4">
                <div class="card shadow-sm h-100">
                    <div class="card-body">
                        <h5 class="card-title text-muted"><i class="fa-solid fa-sun text-warning"></i> Luminosity</h5>
                        <h2 id="lum-val" class="display-6 fw-bold">-- lux</h2>
                        <p id="lum-time" class="text-muted small mb-0">A aguardar leitura...</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Secção de Atuadores (Preparação para o Desafio C) -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-white fw-bold">Actuators</div>
                    <div class="card-body">
                        <!-- Ventoinha (Fan) -->
                        <div class="d-flex justify-content-between align-items-center border-bottom pb-3 mb-3">
                            <div>
                                <h6 class="mb-1">
                                    <i class="fa-solid fa-fan"></i> Fan 
                                    <span id="fan-badge" class="badge bg-secondary">OFF</span>
                                </h6>
                                <small id="fan-time" class="text-muted">Sample state at --:--</small>
                            </div>
                            <button id="fan-btn" class="btn btn-outline-primary btn-sm">Turn on</button>
                        </div>

                        <!-- Rega (Irrigation) -->
                        <div class="d-flex justify-content-between align-items-center">
                            <div>
                                <h6 class="mb-1">
                                    <i class="fa-solid fa-water"></i> Irrigation 
                                    <span id="irr-badge" class="badge bg-secondary">OFF</span>
                                </h6>
                                <small id="irr-time" class="text-muted">Sample state at --:--</small>
                            </div>
                            <button id="irr-btn" class="btn btn-outline-primary btn-sm">Turn on</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Script JavaScript em modo Módulo -->
    <script type="module" src="js/index.js"></script>
</body>

</html>
